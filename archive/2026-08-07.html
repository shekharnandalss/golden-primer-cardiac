<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Primer 2026-08-07</title><style>body{margin:0;background:#e9e1cf;color:#27352f;font-family:Georgia,serif}.shell{max-width:1100px;margin:auto;background:#fbf4e3;min-height:100vh}header{position:sticky;top:0;z-index:20;background:#174f3b;color:white;padding:12px;border-bottom:4px solid #b58a32}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.layout{display:grid;grid-template-columns:200px 1fr}aside{position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto;background:#efe1bd;padding:12px}main{padding:12px}.btn{padding:8px 10px;border:1px solid #c8b788;border-radius:9px;background:#fffaf0;color:#27352f;text-decoration:none;cursor:pointer}.pri{background:#174f3b;color:white}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.num{height:34px}.good{background:#e0f0e4}.bad{background:#f6dfda}.card{scroll-margin-top:90px;background:#fffdf7;border:1px solid #d4c49b;border-radius:14px;padding:14px;margin-bottom:14px}.opt{width:100%;text-align:left;padding:10px;margin:5px 0;border:1px solid #d0c097;border-radius:9px;background:white}.correct{background:#e0f0e4}.wrong{background:#f6dfda}.ex{margin-top:10px;background:#f3e7c8;border-left:4px solid #b58a32;padding:11px}.src{margin-top:10px;background:#e8efe5;border:1px solid #bacbb7;padding:11px;border-radius:9px}.wave{height:70px;border:1px solid #d2c095;border-radius:9px;background:#fffaf0}.hidden{display:none}.badge{background:#ead8a4;padding:4px 8px;border-radius:99px;font:700 12px Arial}.finish{border:2px solid #b58a32;border-radius:14px;padding:16px;background:#fffaf0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metrics div{background:white;border:1px solid #d4c49b;padding:9px;border-radius:8px}.fixed{position:fixed;right:10px;bottom:10px;z-index:30}textarea{width:100%;min-height:90px}@media(max-width:720px){.layout const D="https://drive.google.com/file/d/1KBBMNL_8139dwGVxAu7IM31D-7QwKZlx/view",Q=[{"id":"20260807-1","t":"Pulsus alternans","g":"Pulse findings","p":192,"l":"Pulsus alternans is easier to detect by sphygmomanometer","s":"A patient with severe aortic stenosis and LV dysfunction has a regular pulse. Palpation feels nearly uniform, but during slow cuff deflation every other Korotkoff sound is markedly weaker. What is the best interpretation?","o":["Blood-pressure alternans despite subtle peripheral pulse findings","Electrical alternans from pericardial effusion","Pulsus paradoxus","Bigeminy"],"a":0,"c":["Regular rhythm","Alternating Korotkoff intensity","Severe ventricular dysfunction"],"m":"Mechanical alternans may be easier to detect by sphygmomanometer than by palpation. The weak beat may not create enough pressure difference to be obvious at the peripheral pulse.","d":["Electrical alternans is a separate ECG phenomenon.","Pulsus paradoxus varies with respiration.","Bigeminy changes cycle length."],"r":"Regular alternating strong/weak Korotkoff sounds in severe LV dysfunction are pulsus alternans.","w":"alternans","au":""},{"id":"20260807-2","t":"Low-pressure tricuspid regurgitation","g":"Murmurs and JVP","p":422,"l":"In organic low pressure tricuspid regurgitation, the murmur is short as pressures equalize in late systole","s":"A patient with organic tricuspid valve disease has a soft lower-left-sternal systolic murmur that increases with inspiration but ends before S2. There is no severe pulmonary hypertension. Why is the murmur short?","o":["Right atrial and right ventricular pressures equalize before end-systole","The tricuspid valve closes normally in mid-systole","Inspiration abolishes right ventricular ejection","The murmur is actually an ejection murmur"],"a":0,"c":["Organic TR","Low-pressure right-sided circuit","Short regurgitant murmur"],"m":"In low-pressure TR, the RA-RV systolic gradient can disappear before S2, so the regurgitant murmur ends early.","d":["The valve is incompetent, not normally closing early.","Inspiration accentuates right-sided filling.","The location and inspiratory response favor TR."],"r":"A short inspiratory TR murmur can mean low-pressure organic TR, not mild disease.","w":"tr","au":"tr"},{"id":"20260807-3","t":"Pulmonic ejection click","g":"Clicks and snaps","p":355,"l":"Influence of respiration on pulmonary ejection click in pulmonary stenosis","s":"A patient with moderate valvular pulmonic stenosis has an early systolic click obvious in expiration but faint during inspiration. What explains the inspiratory softening?","o":["Higher inspiratory RV diastolic pressure partly opens the pulmonic valve before systole","Inspiration reduces venous return","A2 becomes louder and masks the click","LV pressure moves the click into diastole"],"a":0,"c":["Valvular pulmonic stenosis","Click louder in expiration","Inspiration raises right-sided venous return"],"m":"In a hypertrophied RV, inspiration can raise RV end-diastolic pressure enough to open the pulmonic valve partly before systole, reducing its abrupt systolic excursion and click.","d":["Inspiration increases venous return.","A2 does not explain the click change.","LV pressure does not open the pulmonic valve."],"r":"Pulmonic ejection click is the unusual right-sided sound that can soften with inspiration.","w":"click","au":"click"},{"id":"20260807-4","t":"Paradoxical S2","g":"S2 splitting","p":318,"l":"Mechanisms and causes of reversed splitting of second heart sound","s":"During an episode of acute myocardial ischemia, a patient develops an expiratory S2 split that disappears on inspiration. There is no bundle-branch block. Which event most directly produces the split?","o":["Prolongation of LV mechanical systole delays A2 beyond P2","Delayed RV activation postpones P2","Pulmonary hypertension causes early A2","An atrial shunt fixes the interval"],"a":0,"c":["Split in expiration only","Acute ischemia","No electrical conduction delay"],"m":"Acute ischemia may prolong LV mechanical systole, delaying A2 until after P2. Inspiration delays P2 toward A2 and narrows the split.","d":["Delayed RV activation causes wide normal splitting.","Pulmonary hypertension does not cause early A2.","ASD causes fixed splitting."],"r":"Paradoxical splitting can be mechanical: ischemia may delay A2 even without LBBB.","w":"paradox","au":"paradox"},{"id":"20260807-5","t":"Opening snap severity","g":"Clicks and snaps","p":366,"l":"A narrow S2-OS interval always indicates tight mitral stenosis; when the interval is wide, tight stenosis is not ruled out","s":"A patient has definite rheumatic mitral stenosis, but the A2-opening-snap interval is wider than expected. She also has low cardiac output and LV dysfunction. What is the safest conclusion?","o":["A wide interval does not exclude tight mitral stenosis in this setting","The stenosis must be mild","The sound cannot be an opening snap","A wide interval proves severe aortic regurgitation"],"a":0,"c":["Confirmed MS","Wide A2-OS interval","Low output and LV dysfunction can distort timing"],"m":"A short A2-OS interval strongly supports tight MS, but low output and altered ventricular pressures can widen the interval. Wide timing therefore does not reliably exclude severe stenosis.","d":["Severity cannot be downgraded from this sign alone.","The sound may still be an opening snap.","A wide interval is nonspecific."],"r":"Short A2-OS strongly supports tight MS; wide A2-OS does not reliably exclude it.","w":"os","au":"os"},{"id":"20260807-6","t":"Severe AR blood pressure","g":"Pulse and blood pressure","p":225,"l":"The BP in severe aortic regurgitation is typically expressed as 130/40-0 mmHg","s":"In severe chronic aortic regurgitation, Korotkoff sounds remain audible almost to 0 mmHg, but clear muffling begins at 42 mmHg. How should the diastolic pressure be recorded?","o":["About 42 mmHg, noting sounds persist toward zero","0 mmHg","The midpoint between 42 and 0","Diastolic pressure cannot be estimated"],"a":0,"c":["Severe AR","Sounds persist to zero","Muffling near 40 mmHg"],"m":"Persistent sounds may continue to zero in severe AR. Soma Raju advises using the onset of muffling as the clinically meaningful diastolic pressure and documenting persistence to zero separately.","d":["True diastolic pressure is not zero.","A midpoint has no basis.","The pressure remains clinically recordable."],"r":"In severe AR, use the muffling pressure, e.g. 130/40-0, rather than calling DBP zero.","w":"arbp","au":""},{"id":"20260807-7","t":"PDA cardiac impulse","g":"Apex and impulses","p":285,"l":"A continuous thrill at the pulmonary area with left ventricular enlargement and collapsing pulse is virtually diagnostic of patent ductus arteriosus","s":"A child has a displaced hyperkinetic apex, collapsing pulse, and a continuous thrill maximal in the pulmonary area. Which diagnosis best unifies the findings?","o":["Patent ductus arteriosus","Tetralogy of Fallot","Isolated pulmonic stenosis","Atrial septal defect"],"a":0,"c":["LV volume-loading impulse","Collapsing pulse","Continuous pulmonary-area thrill"],"m":"PDA causes LV volume loading through increased pulmonary venous return and continuous aorta-to-pulmonary runoff.","d":["TOF has reduced pulmonary flow.","Pulmonic stenosis produces a systolic thrill.","ASD predominantly volume-loads the RV."],"r":"Continuous pulmonary-area thrill plus LV enlargement plus collapsing pulse is a PDA signature.","w":"pda","au":"continuous"},{"id":"20260807-8","t":"Cyanotic CHD impulse","g":"Integrated examination","p":286,"l":"Evaluation of the cardiac impulse in congenital heart disease: increased versus decreased pulmonary flow","s":"A cyanotic child has little cardiomegaly, an unimpressive apex, a mild parasternal impulse, no S3, and a systolic thrill at the pulmonary area. Which physiology is most likely?","o":["Decreased pulmonary blood flow, as in tetralogy-type physiology","Increased pulmonary flow with a large post-tricuspid shunt","Severe isolated mitral regurgitation","Hyperkinetic systemic circulation"],"a":0,"c":["Cyanosis","No major cardiac enlargement","Pulmonary-area systolic thrill"],"m":"Decreased-flow cyanotic lesions tend to lack cardiomegaly and AV-valve flow murmurs, whereas increased-flow lesions produce larger, more hyperdynamic impulses and filling sounds.","d":["Increased pulmonary flow usually enlarges the heart.","MR does not explain this cyanotic pattern.","Hyperkinetic states do not fit the quiet apex."],"r":"Cyanosis plus small heart plus quiet apex plus pulmonary-area thrill points to decreased pulmonary flow.","w":"chd","au":""},{"id":"20260807-9","t":"Graham Steell murmur","g":"Diastolic murmurs","p":470,"l":"Murmur of pulmonary incompetence in pulmonary hypertension","s":"A patient with severe pulmonary arterial hypertension has a high-pitched early diastolic murmur along the left sternal border, a loud palpable P2, and no collapsing pulse. Which lesion best explains the murmur?","o":["Functional pulmonary regurgitation (Graham Steell)","Severe aortic regurgitation","Mitral stenosis","Pulmonic stenosis"],"a":0,"c":["Severe PAH","Early diastolic LSB murmur","Loud P2 without systemic runoff"],"m":"Severe pulmonary hypertension can dilate the pulmonary annulus and produce functional pulmonary regurgitation. A loud P2 and absence of systemic runoff signs favor Graham Steell over AR.","d":["Severe AR usually has systemic runoff signs.","MS is a low-pitched apical rumble.","Pulmonic stenosis is systolic."],"r":"Early diastolic LSB murmur plus loud P2 plus no collapsing pulse suggests Graham Steell PR.","w":"pr","au":"diastolic"},{"id":"20260807-10","t":"Aortic regurgitation maneuver","g":"Respiratory and postural maneuvers","p":461,"l":"Table 24.11: Features of the murmur of aortic regurgitation","s":"A soft early diastolic murmur is suspected in a patient with aortic-root disease. Which bedside sequence should most reliably accentuate it?","o":["Sit or stand leaning forward, hold expiration, then use isometric handgrip","Lie supine, take deep inspiration, then perform Valsalva strain","Stand abruptly and inhale deeply","Left lateral position with sustained Valsalva"],"a":0,"c":["Suspected AR","Reduce lung interference","Increase systemic resistance"],"m":"AR is best heard upright and leaning forward during held expiration. Handgrip raises systemic vascular resistance and can increase regurgitant flow.","d":["Deep inspiration favors right-sided sounds.","Standing alone reduces stroke volume.","Left lateral positioning is for apical low-frequency sounds."],"r":"For subtle AR: lean forward, expire and hold, then handgrip if needed.","w":"armaneuver","au":"diastolic"}],K='gp_2026-08-07',PKEY='gp_cardiac_profile_v3';

function wave(w){let p=w==='alternans'?'0,70 60,15 120,60 180,70 240,35 300,63 360,70 420,15 480,60 540,70 600,35':w==='paradox'?'0,65 60,20 100,65 280,65 320,35 350,65 400,22 435,65 600,65':'0,65 60,18 100,65 280,65 320,25 355,65 600,65';return `<svg viewBox="0 0 600 100" width="100%" height="100%"><polyline points="${p}" fill="none" stroke="#174f3b" stroke-width="4"/></svg>`}
function sound(n){if(!n||!S.audio)return;let A=window.AudioContext||window.webkitAudioContext,c=new A(),z=c.currentTime+.04;function t(x,f=80,d=.06,g=.35){let o=c.createOscillator(),v=c.createGain();o.frequency.value=f;v.gain.setValueAtTime(.001,z+x);v.gain.exponentialRampToValueAtTime(g,z+x+.005);v.gain.exponentialRampToValueAtTime(.001,z+x+d);o.connect(v).connect(c.destination);o.start(z+x);o.stop(z+x+d+.02)}for(let k=0;k<3;k++){let q=k*.95;t(q);if(n==='click')t(q+.08,175,.025,.35);if(n==='paradox'){t(q+.39,130,.04,.28);t(q+.49,100,.04,.32)}if(n==='os')t(q+.55,180,.025,.34);if(n==='continuous')for(let m=0;m<14;m++)t(q+.05+m*.045,95,.035,.06);if(n==='diastolic')for(let m=0;m<6;m++)t(q+.48+m*.06,72,.04,.08);if(n==='tr')for(let m=0;m<7;m++)t(q+.1+m*.045,90,.035,.07);t(q+.42,105,.05,.30)}setTimeout(()=>c.close(),3100)}
function crop(q,k){let b=`2026-08-07_Soma-Raju_Q${String(k+1).padStart(2,'0')}_printed-p${q.p}`;return `<b>Crop 1:</b> ${b}_top-half.png · printed p${q.p}, PDF p${q.p+17}, top half<br><b>Crop 2:</b> ${b}_bottom-half.png · printed p${q.p}, PDF p${q.p+17}, bottom half`}

function done(){S.complete=true;let x=syncData(),c=x.items.filter(z=>z.correct).length,p=c*10;interpret.innerHTML=`<p><b>${p>=90?'Excellent discrimination':p>=80?'Strong bedside pattern recognition':p>=70?'Functional but uneven':'Needs targeted repair'}.</b> ${c}/10 (${p}%).</p>`;metrics.innerHTML=`<div>Score<h2>${c}/10</h2></div><div>Accuracy<h2>${p}%</h2></div><div>Time<h2>${Math.floor(S.sec/60)}:${String(S.sec%60).padStart(2,'0')}</h2></div><div>Mean/card<h2>${Math.round((S.rt.reduce((a,b)=>a+b,0)||S.sec)/10)}s</h2></div>`;let G={};x.items.forEach(z=>{G[z.domain]??={n:0,c:0};G[z.domain].n++;G[z.domain].c+=z.correct});domains.innerHTML=Object.entries(G).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([g,v])=>`<p><b>${g}</b>: ${v.c}/${v.n}</p>`).join('');reviews.innerHTML=x.items.sort((a,b)=>a.interval_d-b.interval_d).map(z=>`<p><b>${z.concept}</b>: review in ${z.interval_d} day${z.interval_d===1?'':'s'}</p>`).join('');sync.value=JSON.stringify(x);finish.classList.remove('hidden');let P={};try{P=JSON.parse(localStorage.getItem(PKEY))||{}}catch(e){};x.items.forEach(z=>P[z.id]=z);localStorage.setItem(PKEY,JSON.stringify(P));save()}
