<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Primer 2026-08-08</title><style>:root{--p:#fbf4e3;--p2:#efe1bd;--g:#174f3b;--gold:#b58a32;--ok:#e0f0e4;--bad:#f6dfda;--ink:#27352f;--line:#d4c49b}*{box-sizing:border-box;scroll-behavior:smooth}body{margin:0;background:#e9e1cf;color:var(--ink);font-family:Georgia,serif}.shell{max-width:1100px;margin:auto;background:var(--p);min-height:100vh}header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:12px;border-bottom:4px solid var(--gold)}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.layout{display:grid;grid-template-columns:200px 1fr}aside{position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto;background:var(--p2);padding:12px}main{padding:12px}.btn{padding:8px 10px;border:1px solid #c8b788;border-radius:9px;background:#fffaf0;color:var(--ink);text-decoration:none;cursor:pointer}.pri{background:var(--g);color:#fff}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.num{height:34px}.good{background:var(--ok)}.bad{background:var(--bad)}.card{scroll-margin-top:90px;background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}.opt{width:100%;text-align:left;padding:10px;margin:5px 0;border:1px solid #d0c097;border-radius:9px;background:#fff}.correct{background:var(--ok)}.wrong{background:var(--bad)}.ex{margin-top:10px;background:#f3e7c8;border-left:4px solid var(--gold);padding:11px}.src{margin-top:10px;background:#e8efe5;border:1px solid #bacbb7;padding:11px;border-radius:9px}.wave{height:70px;border:1px solid #d2c095;border-radius:9px;background:#fffaf0}.hidden{display:none}.badge{background:#ead8a4;padding:4px 8px;border-radius:99px;font:700 12px Arial}.finish{border:2px solid var(--gold);border-radius:14px;padding:16px;background:#fffaf0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metrics div{background:#fff;border:1px solid var(--line);padding:9px;border-radius:8px}.fixed{position:fixed;right:10px;bottom:10px;z-index:30}textarea{width:100%;min-height:90px}@media(max-width:720px){.layout{grid-template-columns:1fr}aside{position:relative;top:0;height:auto}.nums{grid-template-columns:repeat(10,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}main{padding:8px}}</style></head><body><div class="shell"><header><div class="row"><div><b style="color:#f1d78f">GOLDEN PRIMER · CARDIAC EXAM</b><div>2026-08-08 · adaptive continuous drill</div></div><div><button class="btn" id="audio">Enable auto-audio</button> <button class="btn" id="fs">Full screen</button> <span class="btn">Time <b id="timer">00:00</b></span></div></div></header><div class="layout"><aside><div class="row"><b>Progress</b><span id="count" class="badge">0/10</span></div><div id="nums" class="nums"></div><p>Accuracy: <b id="acc">0%</b></p><button class="btn" id="missed">First missed</button> <button class="btn" id="reset">Reset</button><hr><textarea id="importBox" placeholder="Paste prior Learner Sync JSON"></textarea><button class="btn" id="merge">Merge profile</button></aside><main><div id="cards"></div><section id="finish" class="finish hidden"><h2>Drill complete</h2><div id="interpret"></div><div id="metrics" class="metrics"></div><h3>Domain performance</h3><div id="domains"></div><h3>Recommended next review</h3><div id="reviews"></div><h3>Learner Sync Code</h3><textarea id="sync" readonly></textarea><button class="btn pri" id="copy">Copy JSON</button> <button class="btn" id="download">Download JSON</button></section></main></div></div><a class="btn pri fixed" target="_blank" href="https://drive.google.com/file/d/1KBBMNL_8139dwGVxAu7IM31D-7QwKZlx/view">Soma Raju PDF ↗</a><script>const D="https://drive.google.com/file/d/1KBBMNL_8139dwGVxAu7IM31D-7QwKZlx/view",Q=[{"id":"20260808-01","t":"JVP timing in first-degree AV block","g":"JVP waveform","p":234,"l":"if the a wave appears to occur well before S1, the P-R interval is prolonged","s":"While observing the neck veins, the a wave is clearly separated from S1 and occurs distinctly before it. Which ECG abnormality best explains this?","o":["First-degree AV block","Short-PR pre-excitation","Atrial fibrillation","Complete heart block with cannon a waves"],"a":0,"m":"A prolonged PR interval separates atrial contraction from ventricular systole, so the transmitted a wave is seen clearly before S1.","r":"A wave clearly before S1 suggests prolonged AV conduction.","w":"early_a","au":""},{"id":"20260808-02","t":"Tamponade versus constriction by JVP","g":"JVP waveform","p":256,"l":"Table 14.21: Jugular venous pulse in pericardial tamponade","s":"A hypotensive patient has a markedly elevated JVP. Which waveform pattern most strongly supports cardiac tamponade rather than constrictive pericarditis?","o":["Prominent x descent with absent or obliterated y descent","Rapid y descent with equal a and v waves","Giant a waves with slow y descent","Ventricularized cv waves"],"a":0,"m":"Tamponade preserves the x descent but impairs early ventricular filling, so the y descent is blunted or absent. Constriction classically has a rapid y descent.","r":"Tamponade: x preserved/prominent, y absent; constriction: y rapid.","w":"tamponade","au":""},{"id":"20260808-03","t":"Normal JVP descents","g":"JVP waveform","p":234,"l":"The y descent is more prominent than the x descent in normal people","s":"In a healthy adult with a clearly visible jugular venous waveform, which descent is usually more prominent?","o":["y descent","x descent","Neither descent","They are always exactly equal"],"a":0,"m":"Soma Raju describes the normal y descent as more prominent than the x descent.","r":"Normal JVP: y descent usually exceeds x descent.","w":"normal_jvp","au":""},{"id":"20260808-04","t":"Sphygmomanometric pulsus paradoxus","g":"Pulse findings","p":195,"l":"difference between intermittent audibility and continuous audibility gives the degree of paradoxus","s":"Korotkoff sounds first appear only during expiration at 126 mmHg and become audible throughout respiration at 108 mmHg. What is the pulsus paradoxus?","o":["18 mmHg","10 mmHg","8 mmHg","34 mmHg"],"a":0,"m":"The degree is the difference between intermittent expiratory audibility and continuous audibility: 126 minus 108 = 18 mmHg.","r":"Paradoxus = intermittent-expiratory pressure minus continuous-audibility pressure.","w":"paradoxus","au":""},{"id":"20260808-05","t":"Short PR and loud S1","g":"Heart sounds","p":302,"l":"Relationship of P-R interval to the intensity of first heart sound","s":"A young patient with a PR interval of 100 ms has a loud S1 despite normal mitral leaflets. What mechanism best explains it?","o":["Atrial contraction keeps the mitral valve relatively open at onset of ventricular systole","Premature mitral closure before systole","Delayed pulmonic closure","Reduced myocardial contractility"],"a":0,"m":"With a short PR interval, atrial contraction occurs close to ventricular systole and keeps the mitral valve relatively open, increasing leaflet excursion and closure intensity.","r":"Short PR tends to make S1 loud; long PR tends to soften it.","w":"s1","au":"louds1"},{"id":"20260808-06","t":"Wide S2 by severe MR","g":"S2 splitting","p":315,"l":"Earlier completion of LV ejection: Severe mitral regurgitation","s":"A patient with severe mitral regurgitation has an expiratory S2 split that remains audible while standing. There is no RBBB or pulmonic stenosis. Which mechanism can produce this wide split?","o":["Earlier completion of LV ejection causing early A2","Delayed electrical activation of the RV","Early P2 from pulmonary hypertension","Fixed interatrial shunting"],"a":0,"m":"Severe MR can shorten effective LV forward ejection because blood escapes into the low-pressure left atrium, allowing A2 to occur earlier and widen A2-P2.","r":"Wide S2 can result from early A2, not only delayed P2.","w":"wide","au":"wide"},{"id":"20260808-07","t":"HOCM versus fixed AS maneuver response","g":"Murmurs and maneuvers","p":397,"l":"Table 23.6: Influence of various maneuvers in aortic stenosis","s":"A systolic ejection murmur becomes louder on standing and during Valsalva strain. Why does this favor HOCM over fixed aortic stenosis?","o":["Reduced venous return shrinks the LV cavity and intensifies dynamic obstruction","Reduced venous return increases flow across a fixed valve","Standing raises stroke volume","Valsalva selectively raises aortic pressure"],"a":0,"m":"Reduced preload decreases LV cavity size, worsening dynamic LV outflow obstruction. Fixed AS usually becomes softer as flow falls.","r":"Standing or Valsalva louder suggests dynamic obstruction.","w":"hocm","au":"esm"},{"id":"20260808-08","t":"Gallavardin phenomenon","g":"Murmurs","p":396,"l":"The high-frequency soft component, however, is widely transmitted especially to the apex","s":"An older patient has a harsh systolic ejection murmur at the right upper sternal border plus a softer high-pitched systolic murmur at the apex, but no radiation to the axilla or back. Best explanation?","o":["Gallavardin transmission of aortic stenosis","Separate mitral regurgitation","Tricuspid regurgitation","Ventricular septal defect"],"a":0,"m":"The high-frequency component of an aortic stenosis murmur can transmit to the apex and mimic MR. Lack of typical axillary or back radiation is a useful clue.","r":"Apical systolic murmur without axillary radiation may be Gallavardin AS.","w":"gallavardin","au":"esm"},{"id":"20260808-09","t":"LV S3 auscultation technique","g":"Heart sounds","p":338,"l":"The left ventricular third heart sound is best heard at the apex with the bell in the left lateral position during expiration","s":"A faint post-S2 low-pitched sound is suspected in a patient with LV systolic dysfunction. Which technique is most likely to reveal a left-sided S3?","o":["Bell lightly at the apex in left lateral position during expiration","Diaphragm at the base during deep inspiration","Firm diaphragm pressure at the apex while standing","Bell at the lower left sternal border during inspiration"],"a":0,"m":"An LV S3 is low frequency and best detected with the bell at the apex in the left lateral position during expiration.","r":"LV S3: bell, apex, left lateral, expiration.","w":"s3","au":"s3"},{"id":"20260808-10","t":"Systolic apical retraction","g":"Apex and impulses","p":266,"l":"This apical retraction is the palpable equivalent of paradoxic septal motion","s":"A patient with a large ASD has an apex that retracts inward during systole and moves outward in diastole. What is the underlying mechanism?","o":["Paradoxical septal motion from right ventricular volume overload","Left ventricular pressure overload","Premature mitral closure","Aortic root dilatation"],"a":0,"m":"With RV volume overload, the septum may move paradoxically with the RV. The palpable counterpart is systolic retraction of the apex.","r":"Systolic apical retraction is the palpable counterpart of paradoxical septal motion.","w":"retract","au":""}],K='gp_2026-08-08',PK='gp_cardiac_profile_v4';let S={sel:Array(10).fill(null),done:Array(10).fill(false),sec:0,audio:false,played:Array(10).fill(false),start:Array(10).fill(null),rt:Array(10).fill(0),conf:Array(10).fill(0),complete:false};try{S={...S,...JSON.parse(localStorage.getItem(K))}}catch(e){}const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(S));function wave(w){let p=w==='early_a'?'0,60 45,60 85,18 120,60 280,60 325,25 360,60 520,60 555,22 590,60':w==='tamponade'?'0,55 75,18 130,55 210,20 285,55 420,55 510,55 600,55':w==='normal_jvp'?'0,60 55,22 95,60 150,72 220,60 290,32 330,60 385,80 455,60 520,25 575,60':w==='paradoxus'?'0,68 55,16 115,55 180,68 250,30 315,61 380,68 450,18 515,57 600,68':w==='wide'?'0,65 55,18 90,65 250,65 285,25 315,65 350,24 385,65 600,65':w==='hocm'?'0,70 70,18 150,48 225,26 310,68 395,20 475,48 550,28 600,70':w==='retract'?'0,55 120,55 220,75 330,78 450,45 550,28 600,50':'0,65 55,18 90,65 280,65 315,25 350,65 600,65';return `<svg viewBox="0 0 600 100" width="100%" height="100%"><polyline points="${p}" fill="none" stroke="#174f3b" stroke-width="4"/></svg>`}function sound(n){if(!n||!S.audio)return;let A=window.AudioContext||window.webkitAudioContext,c=new A(),z=c.currentTime+.04;function t(x,f=80,d=.06,g=.35){let o=c.createOscillator(),v=c.createGain();o.frequency.value=f;v.gain.setValueAtTime(.001,z+x);v.gain.exponentialRampToValueAtTime(g,z+x+.005);v.gain.exponentialRampToValueAtTime(.001,z+x+d);o.connect(v).connect(c.destination);o.start(z+x);o.stop(z+x+d+.02)}for(let k=0;k<3;k++){let q=k*.95;t(q);if(n==='louds1')t(q,75,.07,.55);if(n==='wide'){t(q+.41,105,.04,.3);t(q+.53,132,.04,.3)}if(n==='esm')for(let m=0;m<6;m++)t(q+.1+m*.05,100,.035,.08);if(n==='s3')t(q+.56,55,.08,.28);t(q+.42,105,.05,.3)}setTimeout(()=>c.close(),3100)}function card(q,k){let b=`2026-08-08_Soma-Raju_Q${String(k+1).padStart(2,'0')}_printed-p${q.p}`;return `<article class="card" id="c${k}" data-i="${k}"><div class="row"><div><span class="badge">${k+1}/10</span> <span class="badge">${q.g}</span><div style="font:12px Arial">Printed p${q.p} · PDF p${q.p+17}</div></div></div><h3>${q.s}</h3><div class="wave">${wave(q.w)}</div>${q.au?`<div style="font:12px Arial">Offline schematic teaching reconstruction, not a patient recording.</div><button class="btn pri play" data-i="${k}">Replay sound</button>`:''}<div>${q.o.map((x,j)=>`<button class="opt" data-i="${k}" data-j="${j}"><b>${String.fromCharCode(65+j)}.</b> ${x}</button>`).join('')}</div><div id="a${k}" class="hidden"><div class="ex verdict"></div><div class="ex"><b>Mechanism</b><p>${q.m}</p><p><b>Bedside rule:</b> ${q.r}</p><label>Confidence <select class="conf" data-i="${k}"><option value="0">Not set</option><option value="1">1 low</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5 high</option></select></label></div><div class="src"><b>B. Soma Raju, Clinical Methods in Cardiology</b><br>Printed p${q.p} · PDF p${q.p+17}<br>Locator: “${q.l}”<p><a class="btn pri" target="_blank" href="${D}">Open full book ↗</a></p><b>Crop 1:</b> ${b}_top-half.png<br><b>Crop 2:</b> ${b}_bottom-half.png</div></div></article>`}cards.innerHTML=Q.map(card).join('');function render(i){let q=Q[i],c=$('c'+i),a=$('a'+i);c.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=S.done[i];b.classList.toggle('correct',S.done[i]&&j===q.a);b.classList.toggle('wrong',S.done[i]&&j===S.sel[i]&&j!==q.a)});if(S.done[i]){a.classList.remove('hidden');a.querySelector('.verdict').innerHTML=S.sel[i]===q.a?`<b>Correct.</b> ${q.o[q.a]}`:`<b>Incorrect.</b> Correct answer: ${q.o[q.a]}`;a.querySelector('.conf').value=S.conf[i]}else a.classList.add('hidden')}function answer(i,j){if(S.done[i])return;S.sel[i]=j;S.done[i]=true;S.rt[i]=S.start[i]?Math.max(1,Math.round((Date.now()-S.start[i])/1000)):0;render(i);stats();setTimeout(()=>{let n=Q.findIndex((_,x)=>x>i&&!S.done[x]);(n>=0?$('c'+n):finish).scrollIntoView({behavior:'smooth'})},400)}document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i,+b.dataset.j));document.querySelectorAll('.play').forEach(b=>b.onclick=()=>sound(Q[+b.dataset.i].au));document.querySelectorAll('.conf').forEach(s=>s.onchange=()=>{S.conf[+s.dataset.i]=+s.value;save()});function stats(){let n=S.done.filter(Boolean).length,c=S.done.reduce((a,v,i)=>a+(v&&S.sel[i]===Q[i].a),0);count.textContent=`${n}/10`;acc.textContent=n?Math.round(c/n*100)+'%':'0%';nums.innerHTML=Q.map((q,i)=>`<button class="num ${S.done[i]?(S.sel[i]===q.a?'good':'bad')}" data-i="${i}">${i+1}</button>`).join('');nums.querySelectorAll('button').forEach(b=>b.onclick=()=>$('c'+b.dataset.i).scrollIntoView({behavior:'smooth'}));if(n===10&&!S.complete)done();save()}function interval(ok,conf,lap){if(!ok)return 1;if(conf>=4&&lap===0)return 14;if(conf>=3)return 7;return 3}function syncData(){let P={};try{P=JSON.parse(localStorage.getItem(PK))||{}}catch(e){};return {schema:'golden-primer-cardiac-v1',date:'2026-08-08',items:Q.map((q,i)=>{let ok=S.sel[i]===q.a,old=P[q.id]||{lapses:0};return {id:q.id,concept:q.t,domain:q.g,correct:ok,response_s:S.rt[i]||0,confidence:S.conf[i]||0,last_seen:'2026-08-08',lapses:(old.lapses||0)+(ok?0:1),interval_d:interval(ok,S.conf[i],old.lapses||0)}})}}function done(){S.complete=true;let x=syncData(),c=x.items.filter(z=>z.correct).length,p=c*10;interpret.innerHTML=`<p><b>${p>=90?'Excellent':p>=80?'Strong':p>=70?'Functional but uneven':'Needs targeted repair'}.</b> ${c}/10 (${p}%).</p>`;metrics.innerHTML=`<div>Score<h2>${c}/10</h2></div><div>Accuracy<h2>${p}%</h2></div><div>Time<h2>${Math.floor(S.sec/60)}:${String(S.sec%60).padStart(2,'0')}</h2></div><div>Mean/card<h2>${Math.round((S.rt.reduce((a,b)=>a+b,0)||S.sec)/10)}s</h2></div>`;let G={};x.items.forEach(z=>{G[z.domain]??={n:0,c:0};G[z.domain].n++;G[z.domain].c+=z.correct});domains.innerHTML=Object.entries(G).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([g,v])=>`<p><b>${g}</b>: ${v.c}/${v.n}</p>`).join('');reviews.innerHTML=x.items.sort((a,b)=>a.interval_d-b.interval_d).map(z=>`<p><b>${z.concept}</b>: review in ${z.interval_d} day${z.interval_d===1?'':'s'}</p>`).join('');sync.value=JSON.stringify(x);finish.classList.remove('hidden');let P={};try{P=JSON.parse(localStorage.getItem(PK))||{}}catch(e){};x.items.forEach(z=>P[z.id]=z);localStorage.setItem(PK,JSON.stringify(P));save()}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.55){let i=+e.target.dataset.i;if(!S.start[i])S.start[i]=Date.now();if(S.audio&&Q[i].au&&!S.played[i]){S.played[i]=true;sound(Q[i].au);save()}}}),{threshold:[.55]});document.querySelectorAll('.card').forEach(c=>io.observe(c));audio.onclick=()=>{S.audio=true;audio.textContent='Auto-audio enabled';save()};missed.onclick=()=>{let i=Q.findIndex((q,k)=>S.done[k]&&S.sel[k]!==q.a);if(i>=0)$('c'+i).scrollIntoView({behavior:'smooth'})};reset.onclick=()=>{localStorage.removeItem(K);location.reload()};fs.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();copy.onclick=()=>navigator.clipboard.writeText(sync.value);download.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([sync.value],{type:'application/json'}));a.download='Golden_Primer_Learner_Sync_2026-08-08.json';a.click()};merge.onclick=()=>{try{let x=JSON.parse(importBox.value),P=JSON.parse(localStorage.getItem(PK)||'{}');if(x.schema!=='golden-primer-cardiac-v1')throw Error();x.items.forEach(z=>{if(!P[z.id]||String(z.last_seen)>=String(P[z.id].last_seen))P[z.id]=z});localStorage.setItem(PK,JSON.stringify(P));alert('Profile merged')}catch(e){alert('Invalid Learner Sync JSON')}};setInterval(()=>{S.sec++;timer.textContent=String(Math.floor(S.sec/60)).padStart(2,'0')+':'+String(S.sec%60).padStart(2,'0');save()},1000);Q.forEach((_,i)=>render(i));stats();if(S.complete)done();</script></body></html>
