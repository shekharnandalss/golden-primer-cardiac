<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Primer 2026-08-05</title><style>:root{--p:#fbf4e3;--g:#174f3b;--gold:#b58a32;--ok:#e0f0e4;--bad:#f6dfda;--ink:#27352f;--line:#d4c49b}*{box-sizing:border-box;scroll-behavior:smooth}body{margin:0;background:#e8e0cb;color:var(--ink);font-family:Georgia,serif}.shell{max-width:1100px;margin:auto;background:var(--p);min-height:100vh}header{position:sticky;top:0;z-index:9;background:var(--g);color:#fff;padding:13px;border-bottom:4px solid var(--gold)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.btn{padding:8px 11px;border:1px solid #c8b788;border-radius:9px;background:#fffaf0;color:var(--ink);cursor:pointer;text-decoration:none}.pri{background:var(--g);color:#fff}.layout{display:grid;grid-template-columns:195px 1fr}aside{position:sticky;top:78px;height:calc(100vh - 78px);overflow:auto;background:#efe1bd;padding:12px}main{padding:13px}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.num{height:34px;border:1px solid #c8b788;border-radius:7px}.good{background:var(--ok)}.bad{background:var(--bad)}.card{scroll-margin-top:90px;background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:15px}.opt{width:100%;text-align:left;padding:10px;margin:5px 0;border:1px solid #d0c097;border-radius:9px;background:#fff}.correct{background:var(--ok)}.wrong{background:var(--bad)}.ex{margin-top:10px;background:#f3e7c8;border-left:4px solid var(--gold);padding:11px}.src{margin-top:10px;background:#e8efe5;border:1px solid #bacbb7;padding:11px;border-radius:9px}.wave{height:72px;border:1px solid #d2c095;border-radius:9px;background:#fffaf0;margin:8px 0}.hidden{display:none}.badge{background:#ead8a4;padding:4px 8px;border-radius:99px;font:700 12px Arial}.finish{border:2px solid var(--gold);border-radius:14px;padding:17px;background:#fffaf0;margin-bottom:25px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metrics div{border:1px solid var(--line);padding:9px;border-radius:8px;background:#fff}.fixed{position:fixed;right:10px;bottom:10px;z-index:10}textarea{width:100%;min-height:105px}@media(max-width:720px){.layout{grid-template-columns:1fr}aside{position:relative;top:0;height:auto}.nums{grid-template-columns:repeat(10,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}main{padding:8px}}</style></head><body><div class="shell"><header><div class="row"><div><b style="color:#f1d78f">GOLDEN PRIMER · CARDIAC EXAM</b><div>2026-08-05 · adaptive continuous drill</div></div><div><button class="btn" id="audio">Enable auto-audio</button> <button class="btn" id="fs">Full screen</button> <span class="btn">Time <b id="timer">00:00</b></span></div></div></header><div class="layout"><aside><div class="row"><b>Progress</b><span id="count" class="badge">0/10</span></div><div id="nums" class="nums"></div><p>Accuracy: <b id="acc">0%</b></p><button class="btn" id="missed">First missed</button> <button class="btn" id="reset">Reset</button></aside><main><div id="cards"></div><section id="finish" class="finish hidden"><h2>Drill complete</h2><div id="interpret"></div><div id="metrics" class="metrics"></div><h3>Domain performance</h3><div id="domains"></div><h3>Recommended review</h3><div id="reviews"></div><h3>Learner Sync Code</h3><textarea id="sync" readonly></textarea><button class="btn pri" id="copy">Copy JSON</button> <button class="btn" id="download">Download JSON</button></section></main></div></div><a class="btn pri fixed" target="_blank" rel="noopener" href="https://drive.google.com/file/d/1KBBMNL_8139dwGVxAu7IM31D-7QwKZlx/view">Soma Raju PDF ↗</a><script>const D='https://drive.google.com/file/d/1KBBMNL_8139dwGVxAu7IM31D-7QwKZlx/view',Q=[{id:'jvp-prolonged-pr',t:'JVP timing',g:'JVP waveform',p:234,l:'If the a wave appears to occur well before S1, the P-R interval is prolonged',s:'While observing the neck veins, the a wave is clearly seen well before S1 rather than nearly coinciding with it. Which ECG finding is most likely?',o:['First-degree AV block','Short PR pre-excitation','Atrial fibrillation','Complete absence of atrial contraction'],a:0,c:['An a wave is present','It appears unusually early before S1','The finding reflects delayed AV conduction'],m:'A prolonged PR interval increases the time between atrial contraction and ventricular systole, so the transmitted a wave is seen distinctly before S1.',d:['Short PR brings atrial contraction closer to systole.','Atrial fibrillation abolishes organised a waves.','Absent atrial contraction cannot generate an a wave.'],r:'A visibly early a wave before S1 suggests a prolonged PR interval.',w:'early'},{id:'jvp-normal-descents',t:'Normal JVP',g:'JVP waveform',p:234,l:'The y descent is more prominent than the x descent in normal people',s:'A trainee identifies both descents in a normal jugular venous pulse. Which pattern should usually be more prominent?',o:['y descent greater than x descent','x descent greater than y descent','Both descents absent','Only x descent is present'],a:0,c:['Normal JVP','Both descents visible','Need normal relative prominence'],m:'Rapid early right atrial emptying after tricuspid opening makes the y descent more prominent than the x descent.',d:['Dominant x with absent y suggests tamponade.','Both descents are not normally absent.','Normal JVP contains both descents.'],r:'Normal JVP usually has y descent more prominent than x descent.',w:'normal'},{id:'pulse-paradoxus-measurement',t:'Pulsus paradoxus',g:'Pulse findings',p:195,l:'The difference between intermittent and continuous Korotkoff sounds gives the degree of paradoxus',s:'Korotkoff sounds first appear only in expiration at 118 mmHg and become audible throughout respiration at 102 mmHg. What is the measured pulsus paradoxus?',o:['8 mmHg','12 mmHg','16 mmHg','20 mmHg'],a:2,c:['Intermittent sounds at 118','Continuous sounds at 102','Difference defines paradoxus'],m:'The measured paradoxus is 118 minus 102 = 16 mmHg. Values above 10 mmHg meet the definition and above 15 mmHg are significant.',d:['8 and 12 do not match the difference.','20 overestimates the interval.'],r:'Paradoxus equals intermittent-expiratory pressure minus continuously audible pressure.',w:'paradoxus'},{id:'pulse-paradoxus-shunt',t:'Pulsus paradoxus',g:'Pulse findings',p:195,l:'Any condition which permits equal filling of both ventricles (shunt lesions) prevents paradoxus',s:'A patient with a large ASD develops a moderate pericardial effusion. Despite dyspnea, marked pulsus paradoxus is absent. Why?',o:['Interatrial communication equalizes inspiratory filling changes','The effusion increases LV filling during inspiration','ASD abolishes RV filling','Paradoxus requires aortic regurgitation'],a:0,c:['Large ASD','Pericardial effusion','Paradoxus unexpectedly absent'],m:'A shunt permits redistribution and more equal ventricular filling, blunting the inspiratory fall in LV filling that generates paradoxus.',d:['Effusion does not increase LV filling.','ASD does not abolish RV filling.','Aortic regurgitation is not required.'],r:'Large shunts can mask pulsus paradoxus by equalizing ventricular filling.',w:'paradoxus'},{id:'slow-rising-as-elderly',t:'Slow-rising pulse',g:'Pulse findings',p:185,l:'At extremes of age, this sign may be absent',s:'An elderly patient has a long late-peaking ejection systolic murmur and a sustained apex, but the carotid upstroke is not clearly slow. Which interpretation is safest?',o:['Severe aortic stenosis is still possible because arterial stiffness can mask the sign','Severe aortic stenosis is excluded','The murmur must be mitral regurgitation','A normal carotid pulse proves mild stenosis'],a:0,c:['Late-peaking murmur','Sustained apex','Elderly patient'],m:'The slow-rising pulse may be absent in older patients with non-distensible arteries. Concordant murmur and impulse findings carry more weight.',d:['Normal upstroke does not exclude severe AS in elderly patients.','MR has different timing and radiation.','Pulse contour alone cannot grade AS here.'],r:'Do not exclude severe AS from a normal carotid upstroke in an elderly patient.',w:'slow'},{id:'pda-s2-split',t:'S2 in PDA',g:'S2 splitting',p:326,l:'The second heart sound is normally split in patent ductus arteriosus and remains so even after severe PAH',s:'A patient with PDA and Eisenmenger physiology has a difficult-to-hear S2 under a loud continuous murmur. If isolated carefully, which pattern is expected?',o:['S2 usually remains split','S2 becomes paradoxically split','P2 disappears','S2 becomes fixed'],a:0,c:['PDA','Severe pulmonary hypertension','Murmur obscures S2'],m:'S2 remains split in PDA even after severe pulmonary hypertension; the continuous murmur may simply cover it.',d:['Paradoxical splitting requires delayed A2.','P2 does not disappear.','Fixed splitting is classically ASD.'],r:'In PDA, S2 generally remains split even with Eisenmenger physiology.',w:'wide',au:'wide'},{id:'apex-true-diffuse-rv',t:'Diffuse cardiac impulse',g:'Apex and impulses',p:268,l:'Diffuse apical impulse is applicable when severe right ventricular enlargement results in the right ventricle forming the apex',s:'Severe RV enlargement produces a non-localizable impulse extending across the parasternal area. Which description is most accurate?',o:['Diffuse apical impulse because the RV forms the apex','Localized hyperdynamic LV apex','Sustained LV pressure-load impulse','Normal thin-chest impulse'],a:0,c:['Severe RV enlargement','Parasternal impulse','Non-localizable PMI'],m:'The term diffuse impulse is reserved for severe RV enlargement when the RV forms the apex and the maximal impulse shifts parasternal.',d:['Hyperdynamic LV apex remains localizable.','Sustained LV impulse is apical.','This is not a normal thin-chest variant.'],r:'A truly diffuse non-localizable impulse suggests severe RV enlargement.',w:'diffuse'},{id:'lv-enlargement-localized',t:'Apical impulse terminology',g:'Apex and impulses',p:268,l:'Severe left ventricular enlargement produces a larger apical impulse but is still localized by definition',s:'Chronic severe MR produces a broad but still clearly localizable displaced apical impulse. Which term should be avoided?',o:['Diffuse apical impulse','Enlarged apical impulse','Hyperdynamic apical impulse','Displaced apical impulse'],a:0,c:['Severe MR','Broad impulse','Still localizable'],m:'Marked LV enlargement produces a larger impulse that remains localizable and should not be called diffuse.',d:['Enlarged, hyperdynamic, and displaced are accurate.','Diffuse is reserved for a non-localizable RV-dominant impulse.'],r:'If a large LV impulse is still localizable, do not call it diffuse.',w:'apex'},{id:'pda-apical-flow-murmur',t:'Apical diastolic flow murmur',g:'Murmurs',p:449,l:'Causes and mechanisms of diastolic murmur at apex',s:'A large PDA without organic mitral disease produces an apical mid-diastolic murmur. What mechanism explains it?',o:['Increased transmitral flow from a large left-to-right shunt','Direct mitral obstruction','Austin Flint interference','A pericardial knock'],a:0,c:['Large PDA','No mitral lesion','Apical mid-diastolic murmur'],m:'Large post-tricuspid shunts increase pulmonary venous return and transmitral flow, producing a functional apical diastolic murmur.',d:['There is no organic obstruction.','Austin Flint requires severe AR.','A knock is a sound, not a flow murmur.'],r:'Apical mid-diastolic murmur in large PDA usually means increased transmitral flow.',w:'ms',au:'ms'},{id:'tricuspid-stenosis-inspiration',t:'Tricuspid stenosis',g:'Murmurs and maneuvers',p:450,l:'The most important difference is the remarkable increase in intensity of the murmur with inspiration',s:'A rheumatic patient has a diastolic rumble at the lower left sternal border that becomes markedly louder with inspiration. Which lesion is most likely?',o:['Tricuspid stenosis','Austin Flint murmur','Mitral stenosis alone','Left atrial myxoma'],a:0,c:['Lower left sternal border','Diastolic rumble','Marked inspiratory augmentation'],m:'The tricuspid stenosis murmur resembles mitral stenosis but increases strikingly with inspiration because right-sided filling rises.',d:['Austin Flint and MS are left-sided.','Myxoma does not produce this right-sided inspiratory response.'],r:'A diastolic rumble markedly louder on inspiration points to tricuspid stenosis.',w:'ms',au:'ms'}],K='gp_2026-08-05',PKEY='gp_cardiac_profile_v2';let S={sel:Array(10).fill(null),done:Array(10).fill(false),flags:Array(10).fill(false),sec:0,audio:false,played:Array(10).fill(false),start:Array(10).fill(null),rt:Array(10).fill(0),complete:false};try{S={...S,...JSON.parse(localStorage.getItem(K))}}catch(e){}const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(S));function wave(w){let p=w==='early'?'0,60 55,60 90,18 125,60 250,60 320,25 355,60 500,60':w==='normal'?'0,60 50,20 90,60 145,78 205,60 275,30 320,60 390,80 455,60':w==='paradoxus'?'0,65 60,18 120,55 180,65 250,30 315,62 390,65 465,20 535,58 600,65':w==='slow'?'0,70 90,66 190,54 300,32 430,18 520,40 600,65':w==='diffuse'?'0,65 100,55 220,35 360,28 500,45 600,60':'0,65 55,18 90,65 270,65 315,25 350,65 390,38 430,65 600,65';return `<svg viewBox="0 0 600 100" width="100%" height="100%"><polyline points="${p}" fill="none" stroke="#174f3b" stroke-width="4"/></svg>`}function sound(n){if(!n||!S.audio)return;let A=window.AudioContext||window.webkitAudioContext,c=new A(),z=c.currentTime+.04;function t(x,f=80,d=.06,g=.35){let o=c.createOscillator(),v=c.createGain();o.frequency.value=f;v.gain.setValueAtTime(.001,z+x);v.gain.exponentialRampToValueAtTime(g,z+x+.005);v.gain.exponentialRampToValueAtTime(.001,z+x+d);o.connect(v).connect(c.destination);o.start(z+x);o.stop(z+x+d+.02)}for(let k=0;k<3;k++){let q=k*.95;t(q);if(n==='wide'){t(q+.4,105,.04,.3);t(q+.51,135,.04,.3)}if(n==='ms')for(let m=0;m<5;m++)t(q+.5+m*.07,55,.04,.08);t(q+.42,105,.05,.32)}setTimeout(()=>c.close(),3000)}function crop(q,k){let b=`2026-08-05_Soma-Raju_Q${String(k+1).padStart(2,'0')}_printed-p${q.p}`;return `<b>Crop 1:</b> ${b}_top-half.png · printed p${q.p}, PDF p${q.p+17}, top half<br><b>Crop 2:</b> ${b}_bottom-half.png · printed p${q.p}, PDF p${q.p+17}, bottom half`}function card(q,k){return `<article class="card" id="c${k}" data-i="${k}"><div class="row"><div><span class="badge">${k+1}/10</span> <span class="badge">${q.g}</span><div style="font:12px Arial">Printed p${q.p} · PDF p${q.p+17}</div></div><button class="btn flag" data-i="${k}">Flag</button></div><h3>${q.s}</h3><div class="wave">${wave(q.w)}</div>${q.au?`<div style="font:12px Arial">Offline schematic teaching reconstruction, not a patient recording.</div><button class="btn pri play" data-i="${k}">Replay</button>`:''}<div>${q.o.map((x,j)=>`<button class="opt" data-i="${k}" data-j="${j}"><b>${String.fromCharCode(65+j)}.</b> ${x}</button>`).join('')}</div><div id="a${k}" class="hidden"><div class="ex verdict"></div><div class="ex"><b>Clue chain</b><ol>${q.c.map(x=>`<li>${x}</li>`).join('')}</ol><b>Mechanism</b><p>${q.m}</p><b>Why distractors are wrong</b><div>${q.d.map(x=>'• '+x).join('<br>')}</div><p><b>Bedside rule:</b> ${q.r}</p></div><div class="src"><b>Clinical Methods in Cardiology</b><br>Printed p${q.p} · PDF p${q.p+17}<br>Locator: “${q.l}”<p><a class="btn pri" target="_blank" href="${D}">Open full book</a></p>${crop(q,k)}</div></div></article>`}cards.innerHTML=Q.map(card).join('');function render(k){let q=Q[k],c=$('c'+k),a=$('a'+k);[...c.querySelectorAll('.opt')].forEach((b,j)=>{b.disabled=S.done[k];b.classList.toggle('correct',S.done[k]&&j===q.a);b.classList.toggle('wrong',S.done[k]&&j===S.sel[k]&&j!==q.a)});if(S.done[k]){a.classList.remove('hidden');a.querySelector('.verdict').innerHTML=S.sel[k]===q.a?`<b>Correct.</b> ${q.o[q.a]}`:`<b>Incorrect.</b> Correct answer: ${q.o[q.a]}`}else a.classList.add('hidden')}function answer(i,j){if(S.done[i])return;S.sel[i]=j;S.done[i]=true;S.rt[i]=S.start[i]?Math.max(1,Math.round((Date.now()-S.start[i])/1000)):0;render(i);stats();setTimeout(()=>{let n=Q.findIndex((_,x)=>x>i&&!S.done[x]);(n>=0?$('c'+n):finish).scrollIntoView({behavior:'smooth'})},500)}document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i,+b.dataset.j));document.querySelectorAll('.flag').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;S.flags[i]=!S.flags[i];stats()});document.querySelectorAll('.play').forEach(b=>b.onclick=()=>sound(Q[+b.dataset.i].au));function stats(){let n=S.done.filter(Boolean).length,c=S.done.reduce((a,v,i)=>a+(v&&S.sel[i]===Q[i].a),0);count.textContent=`${n}/10`;acc.textContent=n?Math.round(c/n*100)+'%':'0%';nums.innerHTML=Q.map((q,i)=>`<button class="num ${S.done[i]?(S.sel[i]===q.a?'good':'bad'):''}" data-i="${i}">${i+1}</button>`).join('');nums.querySelectorAll('button').forEach(b=>b.onclick=()=>$('c'+b.dataset.i).scrollIntoView({behavior:'smooth'}));if(n===10&&!S.complete)done();save()}function syncData(){let P={};try{P=JSON.parse(localStorage.getItem(PKEY))||{}}catch(e){};return {schema:'golden-primer-cardiac-v1',date:'2026-08-05',items:Q.map((q,i)=>{let ok=S.sel[i]===q.a,old=P[q.id]||{lapses:0},lap=(old.lapses||0)+(ok?0:1);return {id:q.id,concept:q.t,domain:q.g,correct:ok,response_s:S.rt[i]||0,confidence:0,last_seen:'2026-08-05',lapses:lap,interval_d:ok?7:1}})}}function done(){S.complete=true;let x=syncData(),c=x.items.filter(z=>z.correct).length,p=c*10;interpret.innerHTML=`<p><b>${p>=90?'Excellent':p>=80?'Strong':p>=70?'Functional but uneven':'Needs targeted repair'}.</b> ${c}/10 (${p}%).</p>`;metrics.innerHTML=`<div>Score<h2>${c}/10</h2></div><div>Accuracy<h2>${p}%</h2></div><div>Time<h2>${Math.floor(S.sec/60)}:${String(S.sec%60).padStart(2,'0')}</h2></div><div>Mean/card<h2>${Math.round(S.sec/10)}s</h2></div>`;let G={};x.items.forEach(z=>{G[z.domain]??={n:0,c:0};G[z.domain].n++;G[z.domain].c+=z.correct});domains.innerHTML=Object.entries(G).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([g,v])=>`<p><b>${g}</b>: ${v.c}/${v.n}</p>`).join('');reviews.innerHTML=x.items.sort((a,b)=>a.interval_d-b.interval_d).map(z=>`<p>${z.concept}: ${z.interval_d} day${z.interval_d===1?'':'s'}</p>`).join('');sync.value=JSON.stringify(x);finish.classList.remove('hidden');let P={};try{P=JSON.parse(localStorage.getItem(PKEY))||{}}catch(e){};x.items.forEach(z=>P[z.id]=z);localStorage.setItem(PKEY,JSON.stringify(P));save()}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.55){let i=+e.target.dataset.i;if(!S.start[i])S.start[i]=Date.now();if(S.audio&&Q[i].au&&!S.played[i]){S.played[i]=true;sound(Q[i].au)}}}),{threshold:[.55]});document.querySelectorAll('.card').forEach(c=>io.observe(c));audio.onclick=()=>{S.audio=true;audio.textContent='Auto-audio enabled';save()};missed.onclick=()=>{let i=Q.findIndex((q,k)=>S.done[k]&&S.sel[k]!==q.a);if(i>=0)$('c'+i).scrollIntoView({behavior:'smooth'})};reset.onclick=()=>{localStorage.removeItem(K);location.reload()};fs.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();copy.onclick=()=>navigator.clipboard.writeText(sync.value);download.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([sync.value],{type:'application/json'}));a.download='Golden_Primer_Learner_Sync_2026-08-05.json';a.click()};setInterval(()=>{S.sec++;timer.textContent=String(Math.floor(S.sec/60)).padStart(2,'0')+':'+String(S.sec%60).padStart(2,'0');save()},1000);Q.forEach((_,i)=>render(i));stats();if(S.complete)done();</script></body></html>
