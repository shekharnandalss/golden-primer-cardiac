><b style="color:#f1d78f">GOLDEN PRIMER · CARDIAC EXAM</b><div>2026-08-04 · 10 new clinical stems</div></div><div><button class="btn" id="audio">Enable audio</button> <button class="btn" id="fs">Full screen</button> <span class="btn">Time <b id="timer">00:00</b></span></div></div></header><div class="layout"><aside><b>Navigator</b><div id="nums" class="nums" style="margin-top:8px"></div><p>Score: <b id="score">0/10</b></p><button class="btn" id="missed">Review missed</button><button class="btn" id="reset">Reset</button></aside><main><div class="row"><div><span id="meta"></span> <span id="topic" class="badge"></span></div><button class="btn" id="flag">Flag</button></div><div class="card" style="margin-top:10px"><h2 id="stem"></h2><div id="wave" class="wave"></div><div id="note" style="font:12px Arial"></div><button class="btn pri" id="play">Play reconstruction</button><div id="opts"></div></div><div id="exp" class="hidden"><div id="verdict" class="ex"></div><div class="ex"><b>Clue chain</b><ol id="clues"></ol><b>Mechanism</b><p id="mech"></p><b>Why distractors are wrong</b><div id="dist"></div><p><b>Bedside rule:</b> <span id="rule"></span></p></div><div id="source" class="src"></div></div><div class="row" style="margin-top:12px"><button class="btn" id="prev">Previous</button><button class="btn pri" id="next">Next</button></div></main></div></div><a class="btn pri fixed" target="_blank" rel="noopener" href="https://drive.google.com/file/d/1KBBMNL_8139dwGVxAu7IM31D-7QwKZlx/view">Soma Raju PDF</a><script>const Q=[{t:'First heart sound',p:302,l:'Relationship of P-R interval to the intensity of first heart sound',s:'A 24-year-old with pre-excitation has a PR interval of 90 ms and no structural valve disease. At the apex, S1 is unusually loud. Which mechanism best explains this finding?',o:['The mitral valve remains relatively open at ventricular systole, increasing leaflet excursion','The mitral valve closes prematurely during late diastole','A2 is delayed and merges with S1','Right ventricular filling is selectively increased'],a:0,c:['Short PR interval','No structural valve disease','Loud apical S1'],m:'Closely timed atrial contraction keeps the mitral valve relatively open at the onset of ventricular systole, increasing leaflet excursion and closure force.',d:['Premature mitral closure softens S1.','A2 belongs to S2.','RV filling does not explain an apical mitral S1.'],r:'Short PR tends to make S1 loud; prolonged PR tends to soften it.',au:'louds1'},{t:'Paradoxical S2',p:327,l:'Reversed or paradoxical splitting',s:'A 66-year-old with chronic LBBB has a split second sound during expiration that becomes single during inspiration. Which sequence is present during expiration?',o:['A2 before delayed P2','P2 before delayed A2','Simultaneous A2 and P2','Absent P2 followed by A2'],a:1,c:['LBBB delays LV activation','Split appears in expiration','Inspiration makes it single'],m:'Delayed LV ejection delays A2 until after P2. Inspiration delays P2 toward A2 and fuses the sounds.',d:['Delayed P2 causes normal or wide splitting.','Simultaneous closure gives a single S2.','P2 is not absent in uncomplicated LBBB.'],r:'Expiration split that disappears on inspiration means P2 precedes delayed A2.',au:'paradox'},{t:'Pulmonic ejection click',p:362,l:'Approach to a patient with clicking sound in systole',s:'In valvular pulmonic stenosis, an early systolic click becomes softer during inspiration while the ejection murmur becomes louder. Why?',o:['Inspiratory RV filling partially opens the pulmonic valve before systole','Inspiration reduces RV preload','The click is mitral in origin','Aortic closure shifts earlier'],a:0,c:['Pulmonic click','Click softens with inspiration','Right-sided murmur increases'],m:'Inspiration increases RV filling and may partially open the stenotic pulmonic valve before systole, reducing abrupt systolic excursion and click intensity.',d:['RV preload rises with inspiration.','A mitral click is apical and posture-sensitive.','A2 timing cannot explain an early systolic click.'],r:'Pulmonic valvular click can soften on inspiration even while the murmur gets louder.',au:'click'},{t:'Opening snap',p:363,l:'The second heart sound-opening snap interval is inversely related to severity',s:'Two patients with mobile rheumatic mitral valves have identical heart rates. A2-OS is 55 ms in A and 105 ms in B. Who likely has higher left atrial pressure?',o:['Patient A','Patient B','Both equal','The interval is unrelated'],a:0,c:['Same heart rate','Mobile stenotic valves','Shorter A2-OS interval'],m:'Higher LA pressure forces the valve open earlier after A2, shortening the interval and indicating tighter stenosis.',d:['A longer interval suggests later opening.','Markedly different intervals do not imply equal pressure.','The interval is a bedside severity clue when the valve is mobile.'],r:'Shorter A2-OS means tighter mobile mitral stenosis.',au:'os'},{t:'TR jugular v wave',p:239,l:'The presence, absence and amplitude of the v wave depends on severity of tricuspid regurgitation and size of the right atrium',s:'Echo shows severe chronic tricuspid regurgitation, but the jugular v waves are only modest. What is the best explanation?',o:['A large compliant right atrium buffers the systolic pressure rise','Severe TR always gives giant v waves','The patient must have tricuspid stenosis','Modest v waves prove low RV pressure'],a:0,c:['Severe chronic TR','Modest v waves','Consider RA compliance'],m:'A large accommodative RA can accept substantial regurgitant volume without a large systolic pressure rise.',d:['V-wave amplitude is not determined by severity alone.','TS causes obstructive a-wave findings.','RV pressure cannot be inferred from v-wave size alone.'],r:'No giant v wave does not exclude severe TR in a large compliant RA.',w:'cv'},{t:'Cannon a waves',p:259,l:'The presence of irregular cannon waves is virtually diagnostic of VT rather than SVT',s:'During a regular broad-complex tachycardia, the arterial pulse is regular, but intermittent giant neck pulsations and variable S1 are present. What is the best conclusion?',o:['VT with AV dissociation is strongly favoured','SVT with fixed 1:1 conduction is proven','Atrial fibrillation is present','A regular arterial pulse excludes VT'],a:0,c:['Broad-complex regular tachycardia','Irregular cannon waves','Variable S1'],m:'AV dissociation allows occasional atrial contraction against a closed tricuspid valve, causing irregular cannon waves and variable S1.',d:['Fixed 1:1 SVT should not cause irregular cannon waves.','AF lacks organised a waves.','The arterial pulse can remain regular in VT.'],r:'Irregular cannon waves plus variable S1 strongly favour VT.',w:'cannon',au:'vars1'},{t:'Tamponade JVP',p:240,l:'Absent y descent in tamponade',s:'A hypotensive patient has raised JVP and a prominent x descent. Which additional finding favours tamponade over constrictive pericarditis?',o:['Absent or blunted y descent','Very rapid y descent','Giant a waves','Ventricularized cv waves'],a:0,c:['Hypotension','Raised JVP','Prominent x descent'],m:'Tamponade restricts filling throughout diastole, so RA emptying is impaired and y descent is absent or blunted.',d:['Rapid y favours constriction.','Giant a waves imply obstruction or AV dissociation.','cv waves imply TR.'],r:'Prominent x with absent y suggests tamponade; prominent x and y suggests constriction.',w:'tamponade'},{t:'Bisferiens pulse',p:184,l:'Anacrotic pulse',s:'A bifid carotid pulse has two systolic peaks, and a harsh systolic murmur increases on standing. Which diagnosis best integrates both findings?',o:['Hypertrophic obstructive cardiomyopathy','Fixed severe valvular aortic stenosis','Cardiac tamponade','Mitral stenosis'],a:0,c:['Two systolic peaks','Murmur louder standing','Dynamic obstruction'],m:'HOCM produces a spike-and-dome contour, and reduced preload on standing intensifies dynamic LV outflow obstruction.',d:['Fixed AS usually gives a slow-rising anacrotic pulse.','Tamponade gives pulsus paradoxus.','MS is diastolic.'],r:'Bisferiens plus a murmur louder on standing points to HOCM.',w:'bisferiens'},{t:'Apical impulse',p:265,l:'Apical impulse in volume overload',s:'Chronic severe aortic regurgitation produces a displaced, diffuse, hyperdynamic apex without a sustained late-systolic heave. Which load pattern explains it?',o:['LV volume overload','LV pressure overload','Isolated RV pressure overload','Normal athletic heart'],a:0,c:['Chronic AR','Displaced diffuse apex','Hyperdynamic not sustained'],m:'LV volume overload enlarges the chamber and produces a displaced diffuse brisk impulse; pressure overload is sustained.',d:['Pressure overload is localized and sustained.','RV pressure overload causes a parasternal heave.','Marked displacement in severe AR is not a normal athletic finding.'],r:'Diffuse hyperdynamic displaced apex means volume overload; sustained apex means pressure overload.',w:'apex'},{t:'MVP maneuver',p:362,l:'Changes significantly with posture: non-ejection click',s:'A mid-systolic click with late systolic apical murmur moves earlier and lengthens after standing. What is the mechanism?',o:['Reduced LV volume causes earlier leaflet prolapse','Increased LV volume delays prolapse','Increased afterload abolishes prolapse','Greater RV filling shifts A2 earlier'],a:0,c:['MVP click-murmur','Standing reduces preload','Click earlier, murmur longer'],m:'Standing reduces LV cavity size, so the leaflets reach the prolapsing position earlier and regurgitation lasts longer.',d:['Increased LV volume delays prolapse.','Standing does not abolish prolapse through afterload.','A2 timing is irrelevant.'],r:'Smaller LV makes the MVP click earlier and murmur longer.',au:'mvp'}],K='gp_2026-08-04';let S={i:0,x:Array(10).fill(null),d:Array(10).fill(false),f:Array(10).fill(false),sec:0,audio:false};try{S={...S,...JSON.parse(localStorage.getItem(K))}}catch(e){}const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(S));function svg(t){let p=t==='cv'?'0,62 70,62 105,30 135,62 220,62 265,8 305,62 400,62 450,12 492,62 600,62':t==='cannon'?'0,62 80,62 110,6 145,62 245,62 300,62 355,8 390,62 500,62 535,6 570,62 600,62':t==='tamponade'?'0,55 80,25 150,55 220,15 290,55 400,55 500,55 600,55':t==='bisferiens'?'0,70 60,20 130,48 210,25 300,68 390,20 460,48 535,26 600,70':'0,68 90,68 170,25 260,22 350,30 450,55 600,68';return `<svg viewBox="0 0 600 100" width="100%" height="100%" preserveAspectRatio="none"><polyline points="${p}" fill="none" stroke="#174f3b" stroke-width="4"/></svg>`}function sound(n){if(!n||!S.audio)return;let A=window.AudioContext||window.webkitAudioContext,c=new A(),z=c.currentTime+.04;function t(x,f=80,d=.06,g=.35){let o=c.createOscillator(),v=c.createGain();o.frequency.value=f;v.gain.setValueAtTime(.001,z+x);v.gain.exponentialRampToValueAtTime(g,z+x+.005);v.gain.exponentialRampToValueAtTime(.001,z+x+d);o.connect(v).connect(c.destination);o.start(z+x);o.stop(z+x+d+.02)}for(let k=0;k<3;k++){let q=k*.95;t(q);if(n==='louds1')t(q,75,.07,.55);if(n==='paradox'){t(q+.36,130,.04,.32);t(q+.46,100,.04,.32)}if(n==='click')t(q+.08,170,.025,.35);if(n==='os')t(q+.55,180,.025,.35);if(n==='vars1')t(q,75,.06,[.25,.55,.35][k]);if(n==='mvp')t(q+.22,180,.025,.35);t(q+.42,105,.05,.32)}setTimeout(()=>c.close(),3000)}function render(){let q=Q[S.i];meta.textContent=`Card ${S.i+1}/10 · printed p${q.p} / PDF p${q.p+17}`;topic.textContent=q.t;stem.textContent=q.s;wave.innerHTML=svg(q.w);note.textContent=q.au?'Offline schematic teaching reconstruction, not a patient recording.':'';play.style.display=q.au?'inline-block':'none';play.onclick=()=>sound(q.au);opts.innerHTML='';q.o.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${String.fromCharCode(65+j)}.</b> ${o}`;if(S.d[S.i]){b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===S.x[S.i]&&j!==q.a)b.classList.add('wrong')}else b.onclick=()=>{S.x[S.i]=j;S.d[S.i]=true;save();render();if(q.au&&S.audio)sound(q.au)};opts.appendChild(b)});if(S.d[S.i]){exp.classList.remove('hidden');verdict.innerHTML=S.x[S.i]===q.a?`<b>Correct.</b> ${q.o[q.a]}`:`<b>Incorrect.</b> Correct answer: ${q.o[q.a]}`;clues.innerHTML=q.c.map(x=>`<li>${x}</li>`).join('');mech.textContent=q.m;dist.innerHTML=q.d.map(x=>'• '+x).join('<br>');rule.textContent=q.r;let b=`2026-08-04_Soma-Raju_Q${String(S.i+1).padStart(2,'0')}_printed-p${q.p}`;source.innerHTML=`<b>Clinical Methods in Cardiology</b><br>Printed p${q.p} · PDF p${q.p+17}<br>Locator: “${q.l}”<p><a class="btn pri" target="_blank" rel="noopener" href="https://drive.google.com/file/d/1KBBMNL_8139dwGVxAu7IM31D-7QwKZlx/view">Open full book</a></p><b>Crop 1:</b> ${b}_top-half.png · top half<br><b>Crop 2:</b> ${b}_bottom-half.png · bottom half`}else exp.classList.add('hidden');prev.disabled=S.i===0;next.textContent=S.i===9?'Finish':'Next';nav();stats();save()}function nav(){nums.innerHTML=Q.map((q,i)=>`<button class="num ${i===S.i?'cur':''} ${S.d[i]?(S.x[i]===q.a?'good':'bad'):''}" data-i="${i}">${i+1}</button>`).join('');nums.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.i=+b.dataset.i;render()})}function stats(){let c=S.d.reduce((n,v,i)=>n+(v&&S.x[i]===Q[i].a),0);score.textContent=`${c}/${S.d.filter(Boolean).length||10}`}next.onclick=()=>{if(S.i<9){S.i++;render()}else alert(`Completed: ${Q.reduce((n,q,i)=>n+(S.x[i]===q.a),0)}/10`)};prev.onclick=()=>{if(S.i){S.i--;render()}};flag.onclick=()=>{S.f[S.i]=!S.f[S.i];save()};missed.onclick=()=>{let i=Q.findIndex((q,k)=>S.d[k]&&S.x[k]!==q.a);if(i>=0){S.i=i;render()}};reset.onclick=()=>{localStorage.removeItem(K);location.reload()};audio.onclick=()=>{S.audio=true;audio.textContent='Audio enabled';save();sound(Q[S.i].au)};fs.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();setInterval(()=>{S.sec++;timer.textContent=String(Math.floor(S.sec/60)).padStart(2,'0')+':'+String(S.sec%60).padStart(2,'0');save()},1000);render();</script></body></h
